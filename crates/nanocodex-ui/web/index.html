<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nanocodex Agents</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fafbf9}canvas{display:block}</style>
<script type="module">
import init, { mount, update } from './@BUNDLE@/nanocodex_ui.js';
const origin = location.origin;
let mounted = false;
let initialized = false;
let latest;
const failure = error => parent.postMessage({type:'gpui:error',message:String(error)}, origin);
addEventListener('error', event => failure(event.message));
addEventListener('unhandledrejection', event => failure(event.reason));
function apply(snapshot) {
  latest = snapshot;
  if (!initialized) return;
  const json = JSON.stringify(snapshot);
  if (!mounted) {
    mounted = true;
    mount(json, value => parent.postMessage({type:'gpui:action', action:JSON.parse(value)}, origin));
  } else if (!update(json)) requestAnimationFrame(() => apply(latest));
}
addEventListener('message', event => {
  if (event.source !== parent || event.origin !== origin || event.data?.type !== 'gpui:snapshot') return;
  try { apply(event.data.snapshot); } catch (error) { failure(error); }
});
try {
  await init(); initialized = true;
  parent.postMessage({type:'gpui:ready'}, origin);
  if (latest) apply(latest);
} catch (error) { failure(error); }
</script>
</html>
