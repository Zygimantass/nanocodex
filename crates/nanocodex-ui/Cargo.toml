[package]
name = "nanocodex-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

# The renderer has its own dependency graph; the SDK does not depend on GPUI.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "36682547bea1c3d4fa60c08d341cf60081853941", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "36682547bea1c3d4fa60c08d341cf60081853941", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.13"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "36682547bea1c3d4fa60c08d341cf60081853941", default-features = false, features = ["font-kit"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-channel = "2"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.126"
js-sys = "=0.3.103"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[[bin]]
name = "nanocodex-ui"
path = "src/main.rs"
